<!DOCTYPE html>
<html lang="pt-br">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Pokedex</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>

        <header>
            <section class= 'section' id="titulo_section">
                <div id="titulo">
                    <h1 class='pokebola' id="p">P</h1>
                    <img id="pokebola" src="pngs/pokebola.png" alt="">
                    <h1 class='pokebola' id="kedex">KEDEX</h1>
                </div>
            </section>
        </header>

        <main>
            <section class= 'section' id="conteudo_section">
                <div class="redondo" id="conteudo">


                    <img class= 'img' src="" alt="" id="img_pokemon">
                    <img class= 'img' src="" alt="" id="img_pokemon_shiny">
                    
                </div>

                <div id="container">
                    <img src="pngs/fundo_pokebola.jpeg" alt="" id="retangulo" hidden>
                    <li id="infos" class="section"></li>
                </div>

            </section>
        </main>

        <footer>
            <section class= 'section' id="pesquisa_section">
                <div class= 'redondo' id='pesquisa'>
                <input class='redondo' type="text" id="input" placeholder="Nome do pokemon">
                <button class='redondo' id="botao" type="submit">Encontrar</button>
                </div>
            </section>
        </footer>

        <script src="script.js"></script>
    </body>
</html>
